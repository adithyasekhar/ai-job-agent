<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerPilot AI</title>
<meta name="theme-color" content="#1F2937">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* CareerPilot AI palette: primary #FFC700, secondary #1F2937, bg #FFFFFF, surface #F8F9FC, accent #4F46E5, success #16A34A */
:root{
  --bg:#F8F9FC; --panel:#FFFFFF; --panel2:#F3F4F8; --line:#E5E7EB; --text:#1F2937; --muted:#6B7280;
  --primary:#FFC700; --primary-ink:#1F2937; --slate:#1F2937; --slate2:#2B3647; --slate-text:#CBD5E1;
  --accent:#4F46E5; --accent-soft:#EEF2FF; --good:#15803D; --good-bg:#DCFCE7; --warn:#92400E; --warn-bg:#FEF3C7;
  --bad:#B91C1C; --bad-bg:#FEE2E2; --info:#3730A3; --info-bg:#E0E7FF; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F141C; --panel:#161D28; --panel2:#1D2533; --line:#2A3446; --text:#E8ECF3; --muted:#94A3B8;
    --slate:#0B1018; --slate2:#18202C; --accent:#A5B4FC; --accent-soft:#232A4D; --good:#4ADE80; --good-bg:#12301F;
    --warn:#FCD34D; --warn-bg:#3A2E10; --bad:#FCA5A5; --bad-bg:#3B1717; --info:#C7D2FE; --info-bg:#1E2547;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
/* sidebar: always deep slate, yellow for the active page */
.side{background:var(--slate);display:flex;flex-direction:column;padding:18px 12px;color:var(--slate-text)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 20px}
.brand svg{flex:none}
.brand .nm{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:-.01em}
.brand .nm b{color:var(--primary)}
.brand .tag{font-size:9.5px;letter-spacing:.16em;color:#94A3B8;text-transform:uppercase;margin-top:1px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--slate-text);font-weight:500;margin-bottom:2px}
.nav button svg{flex:none;opacity:.85}
.nav button .lbl{flex:1}
.nav button:hover{background:var(--slate2);color:#fff}
.nav button.on{background:var(--primary);color:var(--primary-ink);font-weight:600}
.nav .count{font-size:11.5px;background:var(--slate2);padding:1px 8px;border-radius:99px;color:var(--slate-text)}
.nav button.on .count{background:rgba(31,41,55,.12);color:var(--primary-ink)}
.side .grow{flex:1}
.status{border:1px solid var(--slate2);border-radius:12px;padding:12px;background:var(--slate2);color:#E2E8F0}
.status .s1{font-weight:600;display:flex;align-items:center;gap:8px}
.status .s2{color:#94A3B8!important}
/* phones: sidebar becomes a bottom bar */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto;height:100dvh}
  .side{order:2;flex-direction:row;padding:6px 4px;overflow-x:auto;gap:2px}
  .brand,.side .grow,.status .s2{display:none}
  .nav{display:flex;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 8px;font-size:10.5px;width:auto;min-width:62px;margin:0}
  .nav button .count{display:none}
  .status{padding:6px;border:0;background:none;display:flex;align-items:center}
  .status .s1{display:none}
  .status .btn{padding:6px 10px;font-size:12px}
  .wrap{padding:16px 14px 28px!important}
  .drawer{width:100%!important}
  .stats{grid-template-columns:repeat(2,1fr)!important}
  .dash{grid-template-columns:minmax(0,1fr)!important}
  .jrow .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hide-phone{display:none!important}
  th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good);box-shadow:0 0 0 4px var(--good-bg);animation:pulse 1.4s infinite}
.dot.paused{background:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--good-bg)}}
.status .s2{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.indigo{background:var(--accent);border-color:var(--accent);color:#fff}
h1,.hero h1{font-family:Poppins,Inter,sans-serif}
.match{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:26px;padding:0 8px;border-radius:99px;font-weight:700;font-size:12px;background:var(--panel2);color:var(--muted)}
.match.hi{background:var(--good-bg);color:var(--good)}
.match.mid{background:var(--warn-bg);color:var(--warn)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.panel{padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.jrow{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.jrow > div{min-width:0}
.panel{min-width:0;overflow:hidden}
.jrow:last-child{border-bottom:0}
.jrow:hover{background:var(--panel2)}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px}
.spark div{flex:1;background:var(--primary);border-radius:5px 5px 0 0;min-height:3px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.searchbar{display:flex;gap:8px;margin:0 0 18px}
.searchbar input{flex:1}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.wide{width:100%}
/* main */
.main{overflow:auto;position:relative}
.wrap{padding:22px 28px 40px;max-width:1500px}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
.sub{color:var(--muted);margin:0 0 18px}
.banner{display:flex;gap:12px;align-items:center;background:var(--info-bg);color:var(--info);border-radius:11px;padding:10px 14px;margin-bottom:16px}
.banner .btn{margin-left:auto}
.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:420px;z-index:30}
.toast.show{opacity:1;transform:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1;min-width:220px}
.field{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;outline:none}
.field:focus{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;cursor:pointer;user-select:none}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
tr.row.sel td{background:var(--accent-soft)}
.t1{font-weight:600}
.t2{color:var(--muted);font-size:12.5px}
.fit{display:inline-grid;place-items:center;width:34px;height:28px;border-radius:8px;font-weight:700;background:var(--panel2);color:var(--muted)}
.fit.hi{background:var(--good-bg);color:var(--good)}
.fit.mid{background:var(--warn-bg);color:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
select.status-sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:12.5px}
.empty{padding:48px;text-align:center;color:var(--muted)}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0 0 4px;font-size:18px;line-height:1.3}
.dbody{padding:16px 20px;overflow:auto;flex:1}
.close{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:12px 0 16px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
.box{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:8px 0 14px;font-size:13.5px}
.box.quote{border-left:3px solid var(--accent)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-top:14px}
textarea.field{width:100%;min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.dbody a,.banner a{color:var(--accent);font-weight:550}
.desc{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:320px;overflow:auto}
/* drafts */
.split{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:60vh}
.list .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:hover{background:var(--panel2)}
.list .item.on{background:var(--accent-soft)}
.doc{padding:22px 28px;overflow:auto}
.doc h1{font-size:20px}.doc h2{font-size:16px;margin:20px 0 6px}
.doc p,.doc li{max-width:75ch}
.doc a{color:var(--accent)}
/* activity */
.log{font:12.5px/1.6 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap;padding:14px 16px;max-height:280px;overflow:auto;color:var(--muted)}
/* settings */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.sect{padding:18px 20px}
.sect h3{margin:0 0 4px;font-size:15px}
.sect .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.frow{display:flex;gap:8px;align-items:center;margin:8px 0}
.frow label{min-width:170px;color:var(--muted)}
.frow .field{flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.msg{font-size:12.5px;margin-left:4px}
.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{color:var(--muted);font-size:12.5px}
a.src{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M6 44c10 8 28 10 42-4" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><path d="M58 8 22 30l10 5 4 13 6-10 9 5z" fill="#FFC700"/><path d="M32 35l26-27-22 30z" fill="#E0A800"/></svg>
      <div><div class="nm">CareerPilot <b>AI</b></div><div class="tag">Discover · Match · Connect · Apply</div><div class="t2" id="ver" style="font-size:11px;color:#64748B"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="grow"></div>
    <div class="status">
      <div class="s1"><span class="dot" id="dot"></span><span id="s1">Starting…</span></div>
      <div class="s2" id="s2"></div>
      <button class="btn primary wide" id="runBtn">Run now</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES = ["New","Interested","Applied","Interview","Offer","Rejected","Skip"];
let api, view = "dashboard", jobs = [], state = {}, drafts = [], selected = null, sortKey = "match", sortDir = -1;
const REMOTE = !!window.CAREERPILOT_REMOTE;   // opened from a phone over Wi-Fi
const ICON = d => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const NAV = [
  ["dashboard", "Dashboard", '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>', null],
  ["all", "Job search", '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', "c-all"],
  ["top", "Top matches", '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', "c-top"],
  ["pipeline", "Applications", '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', "c-pipe"],
  ["contacts", "Contact finder", '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11l2 2 4-4"/>', null],
  ["learning", "Learning hub", '<path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v6c3 2 9 2 12 0v-6"/>', null],
  ["drafts", "Cover letters", '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>', "c-drafts"],
  ["activity", "Activity", '<path d="M3 12h4l3 8 4-16 3 8h4"/>', null],
  ["settings", "Settings", '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>', null],
];
const matchOf = j => j.match ?? (j.fit != null && j.fit !== "" ? j.fit * 10 : null);
function matchHtml(j){ const m = matchOf(j); if (m == null) return '<span class="match">–</span>';
  return `<span class="match ${m>=75?"hi":m>=55?"mid":""}" title="${j.fit!=null&&j.fit!==""?"AI fit "+j.fit+"/10 + meaning-based match":"Meaning-based match (AI score pending)"}">${m}%</span>`; }
function isTop(j){ return ((j.fit||0) >= 7 || (matchOf(j)||0) >= 75) && !["Rejected","Skip"].includes(j.status); }
const filt = {q:"", setup:"", spons:"", source:"", minfit:"", hideClosed:true};
let lastTask = "", lastRunning = false, pendingOpen = null;

function toast(msg, ms=3200){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms); }
function fitCls(f){ return f>=8?"hi":f>=6?"mid":""; }
function spPill(o){ return {Good:'<span class="pill good">Sponsors</span>',Likely:'<span class="pill good">H-1B likely</span>',Possible:'<span class="pill warn">Possible</span>',No:'<span class="pill bad">No sponsorship</span>'}[o] || '<span class="pill">Unknown</span>'; }
function setupPill(w){ return w==="Remote"?'<span class="pill good">Remote</span>':w==="Possibly remote"?'<span class="pill good">Maybe remote</span>':w==="Hybrid"?'<span class="pill info">Hybrid</span>':w==="On-site"?'<span class="pill">On-site</span>':'<span class="pill">—</span>'; }
function rel(iso){ if(!iso) return "never"; const d=(Date.now()-new Date(iso))/60000; if(d<1) return "just now"; if(d<60) return Math.round(d)+" min ago"; if(d<1440) return Math.round(d/60)+" h ago"; return Math.round(d/1440)+" d ago"; }

async function boot(){
  api = window.pywebview.api;
  if (REMOTE) api.open_url = async url => { window.open(url, "_blank"); return true; };
  $("#nav").innerHTML = NAV.filter(([v]) => !(REMOTE && v === "settings")).map(([v, label, icon, cid]) =>
    `<button data-view="${v}" class="${v===view?"on":""}">${ICON(icon)}<span class="lbl">${label}</span>${cid?`<span class="count" id="${cid}">0</span>`:""}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#runBtn").onclick = async () => {
    if (state.running) { await api.stop_run(); toast("Stopping after the current step…"); return; }
    const r = await api.run_now(); if (!r.ok) toast(r.message); else toast("Run started");
    poll();
  };
  await refreshJobs(); await poll(); render();
  setInterval(poll, 2000);
  setInterval(tickStatus, 1000);
}
window.addEventListener("pywebviewready", boot);

async function refreshJobs(){ jobs = await api.get_jobs(); drafts = await api.list_drafts(); counts(); }
function counts(){
  $("#c-all").textContent = jobs.length;
  $("#c-top").textContent = jobs.filter(isTop).length;
  $("#c-pipe").textContent = jobs.filter(j => ["Interested","Applied","Interview","Offer"].includes(j.status)).length;
  $("#c-drafts").textContent = drafts.length;
}
async function poll(){
  state = await api.get_state();
  const busy = state.running || state.task;
  if ((lastRunning || lastTask) && !busy) {           // a task just finished
    if (state.task_result) toast(state.task_result, 5000);
    const reopen = pendingOpen && selected === pendingOpen ? pendingOpen : null; pendingOpen = null;
    await refreshJobs(); if (["dashboard","top","all","pipeline","drafts","contacts","learning"].includes(view)) render();
    if (reopen && view !== "drafts") openJob(reopen);
  }
  if (view === "activity") { const l=$("#livelog"); if(l){ const atEnd=l.scrollTop+l.clientHeight>=l.scrollHeight-20; l.textContent = state.lines.join("\n") || "No run yet in this session."; if(atEnd) l.scrollTop=l.scrollHeight; } }
  lastRunning = state.running; lastTask = state.task;
  if (state.version) $("#ver").textContent = "Version " + state.version;
  tickStatus();
}
function tickStatus(){
  const dot=$("#dot"), s1=$("#s1"), s2=$("#s2"), b=$("#runBtn");
  if (state.running || state.task) {
    const isRun = !state.task || state.task==="Run" || state.task==="Scheduled run";
    dot.className="dot live"; s1.textContent = isRun ? "Searching for jobs…" : state.task+"…";
    s2.textContent = (state.lines||[]).slice(-1)[0]?.slice(10) || "Working…";
    b.textContent = isRun ? "Stop" : "Working…"; b.disabled = !isRun;
    return;
  }
  b.disabled=false; b.textContent="Run now";
  if (!state.schedule_enabled) { dot.className="dot paused"; s1.textContent="Automatic runs paused"; s2.textContent="Last run "+rel(state.last_success); return; }
  dot.className="dot"; const ms = new Date(state.next_run) - Date.now();
  s1.textContent = ms <= 0 ? "Next run any moment" : "Next run in " + (ms>3600000 ? Math.floor(ms/3600000)+" h "+Math.round(ms%3600000/60000)+" min" : Math.floor(ms/60000)+":"+String(Math.floor(ms%60000/1000)).padStart(2,"0"));
  s2.textContent = "Every " + state.interval + " min · last run " + rel(state.last_success);
}

function banner(){

  if (state.ai_label) return "";

function deptFrom(t){
  t = t.toLowerCase();
  if (/workday|hris|people (systems|tech)|hr (systems|tech)/.test(t)) return "HRIS";
  if (/solutions|forward[- ]deployed|implementation/.test(t)) return "Solutions Engineering";
  if (/data scien|analytics|data /.test(t)) return "Data";
  if (/\bai\b|machine learning|\bml\b|llm|genai|generative/.test(t)) return "AI";
  if (/automation|integration/.test(t)) return "Automation";
  return "Engineering";
}
function peopleHtml(j){
  const c = j.company, dept = deptFrom(j.title);
  const core = j.title.replace(/\(.*?\)|,.*$|\b(senior|sr\.?|junior|jr\.?|associate|intern|i{1,3}|iv|\d)\b/gi, "").replace(/\s+/g," ").trim();
  const li = q => "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(q);
  const g = q => "https://www.google.com/search?q=" + encodeURIComponent(q);
  const rows = [
    ["Recruiters", li(`recruiter ${c}`), g(`site:linkedin.com/in "${c}" (recruiter OR "talent acquisition")`)],
    ["Hiring manager", li(`${dept} manager ${c}`), g(`site:linkedin.com/in "${c}" "${dept}" manager`)],
    ["Directors / leaders", li(`director ${dept} ${c}`), g(`site:linkedin.com/in "${c}" ("director" OR "head of") "${dept}"`)],
    ["Team members", li(`${core} ${c}`), g(`site:linkedin.com/in "${c}" "${core}"`)],
  ];
  const link = (u, label) => `<a href="#" onclick="api.open_url(${esc(JSON.stringify(u))});return false">${label}</a>`;
  return `${j.poster_name ? `<div class="box">Posted by ${j.poster_url ? link(j.poster_url, esc(j.poster_name)) : esc(j.poster_name)}: the posting names this person as the hiring contact.</div>` : ""}
    <table style="font-size:13px;margin:6px 0 4px"><tbody>${rows.map(([n,a,b]) => `<tr><td style="padding:5px 0;border:0">${n}</td><td style="padding:5px 8px;border:0">${link(a,"LinkedIn")}</td><td style="padding:5px 0;border:0">${link(b,"Google")}</td></tr>`).join("")}</tbody></table>
    <div class="t2">Opens a search in your browser. You choose whom to contact; nothing is sent for you.</div>`;
}
function visibleJobs(){
  let list = jobs.slice();
  if (view==="top") list = list.filter(isTop);
  if (view==="pipeline") list = list.filter(j => ["Interested","Applied","Interview","Offer"].includes(j.status));
  if (view==="all" && filt.hideClosed) list = list.filter(j => !["Rejected","Skip"].includes(j.status));
  const q = filt.q.toLowerCase();
  if (q) list = list.filter(j => (j.title+" "+j.company+" "+j.location+" "+(j.fit_reason||"")+" "+(j.notes||"")).toLowerCase().includes(q));
  if (filt.setup) list = list.filter(j => filt.setup==="Remote" ? ["Remote","Possibly remote"].includes(j.work_setup) : j.work_setup===filt.setup);
  if (filt.spons) list = list.filter(j => filt.spons==="ok" ? ["Good","Possible"].includes(j.outlook) : j.outlook===filt.spons);
  if (filt.source) list = list.filter(j => j.source===filt.source);
  if (filt.minfit) list = list.filter(j => (j.fit||0) >= +filt.minfit);
  const val = j => sortKey==="match" ? (matchOf(j)??-1) : sortKey==="fit" ? (j.fit??-1) : sortKey==="found" ? (j.found||"") : String(j[sortKey]||"").toLowerCase();
  list.sort((a,b) => { const x=val(a), y=val(b); if (x<y) return -sortDir; if (x>y) return sortDir; return (b.found||"").localeCompare(a.found||""); });
  return list;
}

function drawTable(){

  }
  $("#tablecard").innerHTML = `<table><thead><tr>${th("match","Match")}${th("title","Job")}${th("work_setup","Setup")}${th("outlook","Sponsorship")}${th("source","Source")}${th("found","Found")}${th("status","Status")}</tr></thead>
  <tbody>${list.map(j => `<tr class="row ${selected===j.id?"sel":""}" data-id="${esc(j.id)}">

    <td><div class="t1">${esc(j.title)}${j.draft?' <span class="pill info" title="Cover letter ready">✎</span>':""}</div><div class="t2">${esc(j.company)} · ${esc(j.location)}${j.salary?" · "+esc(j.salary):""}</div></td>
    <td>${setupPill(j.work_setup)}</td><td>${spPill(j.outlook)}</td>
    <td class="t2">${esc(j.source||"")}</td><td class="t2">${esc((j.found||"").slice(5,16))}</td>
    <td><select class="status-sel" data-id="${esc(j.id)}">${STATUSES.map(s=>`<option ${s===(j.status||"New")?"selected":""}>${s}</option>`).join("")}</select></td>
  </tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("th[data-k]").forEach(t => t.onclick = () => { const k=t.dataset.k; if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==="fit"||k==="found")?-1:1; } drawTable(); });
  document.querySelectorAll("tr.row").forEach(r => r.onclick = e => { if (e.target.tagName!=="SELECT" && e.target.tagName!=="OPTION") openJob(r.dataset.id); });

}
async function setStatus(id, status){

/* ---------------- drafts ---------------- */
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s)]+)/g, u => `<a href="#" onclick="api.open_url('${u}');return false">${u}</a>`);
  let out=[], list=false;
  for (const line of src.split(/\r?\n/)) {
    const m = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (!li && list) { out.push("</ul>"); list=false; }
    if (m) out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    else if (li) { if (!list) { out.push("<ul>"); list=true; } out.push(`<li>${inline(li[1])}</li>`); }
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}
let curDraft = null;
function renderDrafts(){
  $("#view").innerHTML = `<h1>Cover letters</h1><p class="sub">Drafts for your best matches. Review and edit them before sending: the agent never applies for you.</p>${banner()}
    ${drafts.length ? `<div class="split"><div class="card list" id="dlist">${drafts.map(d=>`<div class="item ${curDraft===d.rel?"on":""}" data-rel="${esc(d.rel.replace(/\\/g,"/"))}"><div class="t1">${esc(d.title)}</div><div class="t2">${esc(d.company)} · ${esc(d.modified)}</div></div>`).join("")}</div>
      <div class="card doc" id="ddoc"><div class="empty">Pick a cover letter on the left.</div></div></div>`
      : `<div class="card empty">No cover letters yet. They're written automatically for jobs scoring ${state.threshold||8}+, or open any job and click <b>Write cover letter</b>.</div>`}`;
  document.querySelectorAll("#dlist .item").forEach(i => i.onclick = () => showDraft(i.dataset.rel));
  if (curDraft) showDraft(curDraft);
}
async function showDraft(relPath){
  if (view!=="drafts") { curDraft=relPath; go("drafts"); return; }
  curDraft = relPath;
  document.querySelectorAll("#dlist .item").forEach(i=>i.classList.toggle("on", i.dataset.rel===relPath));
  const text = await api.read_draft(relPath);
  $("#ddoc").innerHTML = `<div class="actions" style="margin-bottom:10px"><button class="btn" id="copyBtn">Copy cover letter</button>${REMOTE ? "" : `<button class="btn" onclick="api.open_path('${esc(relPath)}')">Open file</button>`}</div>${md(text)}`;
  $("#copyBtn").onclick = async () => {
    const m = text.match(/## Cover letter\s*\n([\s\S]*?)(\n## |$)/); const letter = (m ? m[1] : text).trim();
    try { await navigator.clipboard.writeText(letter); toast("Cover letter copied"); } catch { toast("Couldn't copy. Use Open file instead."); }
  };
}
